services:
  llm:
    profiles:
      - container-llm
    build:
      context: ..
      dockerfile: agentic-local/Dockerfile.llm
    command:
      - --model
      - /models/LFM2.5-1.2B-Thinking-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "8"
      - --n-gpu-layers
      - "99"
    volumes:
      - ../model:/models:ro
    ports:
      - "8080:8080"

  app:
    build:
      context: .
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_MODEL: local-gguf
      AGENT_WORKSPACE: /workspace
      MAX_AGENT_STEPS: "8"
      MAX_RESPONSE_TOKENS: ${MAX_RESPONSE_TOKENS:--1}
      MAX_STRUCTURED_TOKENS: ${MAX_STRUCTURED_TOKENS:-2048}
      RESPONSE_TIMEOUT: ${RESPONSE_TIMEOUT:-0}
      MAX_CHAT_HISTORY_MESSAGES: ${MAX_CHAT_HISTORY_MESSAGES:-40}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-searxng}
      WEB_SEARCH_FALLBACK: ${WEB_SEARCH_FALLBACK:-tavily}
      WEB_SEARCH_MIN_RESULTS: ${WEB_SEARCH_MIN_RESULTS:-3}
      WEB_SEARCH_LIMIT: ${WEB_SEARCH_LIMIT:-5}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-15}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-2000000}
      WEB_MAX_REDIRECTS: ${WEB_MAX_REDIRECTS:-5}
      WEB_FETCH_RESULTS: ${WEB_FETCH_RESULTS:-3}
      WEB_FETCH_MAX_CHARS: ${WEB_FETCH_MAX_CHARS:-20000}
      RAG_DOCS_DIR: /workspace/docs
      RAG_INDEX_DIR: /workspace/.rag_index
      RAG_SOURCES_DIR: /workspace/.rag_sources
      RAG_CACHE_DIR: /workspace/.rag_cache
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-http://host.docker.internal:8091/v1}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-small-en-v1.5}
      OCR_PROVIDER: ${OCR_PROVIDER:-rapidocr}
      MODEL_ROUTER_ENABLED: ${MODEL_ROUTER_ENABLED:-false}
      MODEL_ROUTER_BASE_URL: ${MODEL_ROUTER_BASE_URL:-http://host.docker.internal:8080}
      MODEL_ROUTER_MAX_MODELS: ${MODEL_ROUTER_MAX_MODELS:-1}
      MODEL_ROUTER_RESTORE_CHAT: ${MODEL_ROUTER_RESTORE_CHAT:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/workspace
    ports:
      - "8000:8000"

  searxng:
    profiles:
      - web-search
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-before-exposing}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "127.0.0.1:8888:8080"
    restart: unless-stopped

volumes:
  searxng-cache:
