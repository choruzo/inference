<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agente local</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div>
          <h1>Agente local</h1>
          <p class="muted">Chat local y documentacion indexada.</p>
        </div>
        <section>
          <h2>Herramientas</h2>
          <ul>
            <li>list_dir</li>
            <li>glob</li>
            <li>find</li>
            <li>read_file</li>
            <li>write_file</li>
            <li>edit_file</li>
            <li>file_info</li>
            <li>rag_status</li>
            <li>rag_reindex</li>
            <li>rag_search</li>
          </ul>
        </section>
        <section>
          <h2>Estado</h2>
          <div id="status" class="status">Conectando...</div>
        </section>
        <section>
          <h2>Documentos</h2>
          <label class="upload-button" for="upload-input">Subir PDF/DOCX/imagen</label>
          <input id="upload-input" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.tif,.tiff,.webp" hidden />
          <div id="upload-status" class="status"></div>
        </section>
      </aside>

      <section class="panel">
        <div id="messages" class="messages"></div>
        <form id="chat-form" class="composer">
          <div class="composer-main">
            <div class="mode-row">
              <div class="mode-picker">
                <button id="mode-button" class="icon-button" type="button" aria-label="Elegir modos" title="Elegir modos">+</button>
                <div id="mode-menu" class="mode-menu" hidden>
                  <label><input type="checkbox" data-mode="chat" /> Chat</label>
                  <label><input type="checkbox" data-mode="rag" /> RAG</label>
                  <label><input type="checkbox" data-mode="web" /> Web</label>
                  <label><input type="checkbox" data-mode="reasoning_panel" /> Razonamiento</label>
                </div>
              </div>
              <div id="mode-chips" class="mode-chips"></div>
              <button id="clear-chat" class="clear-chat" type="button">Limpiar chat</button>
            </div>
            <textarea id="prompt" rows="3" placeholder="Escribe un mensaje..."></textarea>
          </div>
          <button id="send" type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <template id="message-template">
      <article class="message">
        <div class="role"></div>
        <div class="content"></div>
        <div class="citations"></div>
        <details class="trace-panel" hidden>
          <summary>Traza</summary>
          <button class="copy-trace" type="button">Copiar JSON</button>
          <pre></pre>
        </details>
      </article>
    </template>
    <script src="/assets/app.js"></script>
  </body>
</html>
